<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nuevo personaje</title>
  </head>
  <body>
    <header class="cabecera panel-madera">
      <h1><a href="/" class="volver" title="Volver al mundo">←</a> Nuevo personaje</h1>
      <ol class="pasos" aria-label="Pasos de la creación">
        <li id="paso-bando" class="hecho">1 · Bando</li>
        <li class="actual" aria-current="step">2 · Aspecto</li>
        <li>3 · Estilo</li>
        <li>4 · Código</li>
        <li>5 · Nombre</li>
      </ol>
    </header>

    <main class="creador">
      <aside class="vista panel-madera">
        <div class="escenario">
          <canvas id="vista-grande" aria-label="Tu personaje"></canvas>
        </div>
        <div class="fila-real">
          <canvas id="vista-real" title="Tamaño real en el mapa"></canvas>
          <small>Así se verá en el mapa</small>
        </div>
        <div class="acciones">
          <button class="boton" id="deshacer">↶ Deshacer</button>
          <button class="boton" id="azar">🎲 Al azar</button>
          <button class="boton" id="cero">Empezar de cero</button>
        </div>
        <dl id="resumen"></dl>
      </aside>

      <section class="editor panel-pergamino">
        <nav id="pestanas" class="pestanas" aria-label="Partes del personaje"></nav>
        <div id="panel"></div>
      </section>
    </main>
    <dialog id="dlg-nombre" class="panel-pergamino dlg-nombre">
      <form id="form-nombre">
        <h2>¿Cómo se llama tu <span id="dlg-bando">pirata</span>?</h2>
        <p>El estilo de combate, el código y el sueño llegarán en la fase 5. De momento, ponle nombre.</p>
        <input id="input-nombre" maxlength="24" required placeholder="Nombre del personaje" autocomplete="off" />
        <div class="navegacion">
          <button type="button" class="boton" id="cancelar-nombre">Volver</button>
          <button type="submit" class="boton">Soltar al mundo ⚓</button>
        </div>
      </form>
    </dialog>
    <script type="module" src="/src/creador.ts"></script>
  </body>
</html>
